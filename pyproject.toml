[tool.poetry]
name = "gan-models"
version = "0.1.0"
description = "A collection of GAN models for text generation"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
license = "LICENSE"
packages = [
    { include = "models" },
    { include = "metrics" },
    { include = "utils" },
    { include = "instructor" },
    { include = "run" },
    { include = "visual" }
]

[tool.poetry.dependencies]
python = "^3.8"
torch = ">=1.0.0"
numpy = "^1.21.0"
nltk = ">=3.4.5"
tqdm = "4.32.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.0"

[tool.poetry.scripts]
test = "pytest:main"
tests = "pytest:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
python_classes = ["Test*", "*Tests"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=models",
    "--cov=metrics",
    "--cov=utils",
    "--cov=instructor",
    "--cov=run",
    "--cov=visual",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=0",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["models", "metrics", "utils", "instructor", "run", "visual"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "setup.py",
    "config.py",
    "main.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"